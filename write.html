<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>G-HIGH TIMES - 기사 작성</title>
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f4f4; padding: 40px; display: flex; justify-content: center; }
        .editor-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .publish-btn { background: #28a745; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; transition: 0.3s; margin-top: 15px; }
        .publish-btn:hover { background: #218838; }
        .token-box { background: #fff3cd; padding: 15px; border-radius: 5px; margin-bottom: 20px; border-left: 5px solid #ffc107; }
    </style>
</head>
<body>
    <div class="editor-container">
        <h2>🚀 G-HIGH TIMES 기사 발행</h2>
        
        <div class="token-box">
            <strong>🔑 편집장 인증:</strong><br>
            <input type="password" id="github-token" placeholder="여기에 비밀 열쇠(Token)를 입력하세요. (브라우저를 꺼도 저장됩니다)">
        </div>

        <select id="category">
            <option value="News">News</option>
            <option value="Blog">Blog</option>
            <option value="Interview">Interview</option>
        </select>
        <input type="text" id="title" placeholder="기사 제목">
        <input type="text" id="author" placeholder="기자 이름">
        <textarea id="content"></textarea>
        
        <button id="btn-submit" class="publish-btn" onclick="directPublish()">✨ 즉시 기사 발행 (다이렉트)</button>
    </div>

    <script>
        const easyMDE = new EasyMDE({ element: document.getElementById('content'), spellChecker: false });

        // 이전에 입력한 토큰이 있다면 자동으로 불러오기
        document.getElementById('github-token').value = localStorage.getItem('gh-token') || '';

        async function directPublish() {
            const token = document.getElementById('github-token').value;
            const category = document.getElementById('category').value;
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const content = easyMDE.value();

            if(!token || !title || !content) { alert('열쇠(Token), 제목, 내용은 필수입니다!'); return; }
            
            // 토큰 브라우저에 저장
            localStorage.setItem('gh-token', token);

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = "🚀 전송 중...";

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const fileName = `${dateStr}-${Math.floor(Math.random()*10000)}.md`;
            const fileContent = `---\nlayout: post\ntitle: "${title}"\nauthor: "${author}"\ndate: ${dateStr}\ncategories: [${category}]\n---\n\n${content}`;

            // 깃허브 API를 이용해 직접 파일 생성
            const url = `https://api.github.com/repos/HANJUN8/G-HIGH-TIMES/contents/_posts/${fileName}`;
            
            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `New article: ${title}`,
                        content: btoa(unescape(encodeURIComponent(fileContent))) // 내용을 Base64로 변환
                    })
                });

                if (response.ok) {
                    alert('🎉 기사가 성공적으로 발행되었습니다! 약 1~2분 뒤 사이트에 나타납니다.');
                    location.reload();
                } else {
                    const errData = await response.json();
                    alert('❌ 발행 실패: ' + errData.message);
                }
            } catch (error) {
                alert('❌ 에러 발생: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "✨ 발행";
            }
        }
    </script>
</body>
</html>
