<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>G-HIGH TIMES - 기사 작성</title>
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f4f4; padding: 40px; display: flex; justify-content: center; }
        .editor-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        h2 { border-bottom: 2px solid #000; padding-bottom: 10px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .publish-btn { background: #d32f2f; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; transition: 0.3s; margin-top: 15px; }
        .publish-btn:hover { background: #b71c1c; }
        .guide { background: #e3f2fd; padding: 15px; border-left: 4px solid #2196f3; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="editor-container">
        <h2>📰 G-HIGH TIMES 기사 작성</h2>
        
        <div class="guide">
            <strong>✅ 기사 발행 순서:</strong><br>
            1. 카테고리 선택 및 기사 작성 (사진은 깃허브에서 넣기)<br>
            2. <b>[기사 발행하기]</b> 클릭 (내용이 자동으로 복사됩니다!)<br>
            3. 열리는 깃허브 화면 본문에 <b>붙여넣기(Ctrl+V)</b> 하면 끝!
        </div>

        <select id="category">
            <option value="News">News (뉴스)</option>
            <option value="Blog">Blog (블로그/칼럼)</option>
            <option value="Interview">Interview (인터뷰)</option>
        </select>

        <input type="text" id="title" placeholder="기사 제목을 입력하세요">
        <input type="text" id="author" placeholder="작성자 이름">
        <textarea id="content"></textarea>
        
        <button class="publish-btn" onclick="publishArticle()">🚀 기사 발행하기 (자동 복사)</button>
    </div>

    <script>
        const easyMDE = new EasyMDE({
            element: document.getElementById('content'),
            placeholder: "여기에 기사를 작성하세요...",
            spellChecker: false,
            status: false,
            autosave: { enabled: true, uniqueId: "ghigh-editor" } // 자동 저장 기능 추가!
        });

        function publishArticle() {
            const category = document.getElementById('category').value;
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const content = easyMDE.value();
            
            if(!title || !content) { alert('제목과 내용을 입력해주세요!'); return; }

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const fileName = `${dateStr}-${Math.floor(Math.random()*1000)}.md`;
            
            // 깃허브에 들어갈 최종 소스코드 생성
            const fileContent = `---\nlayout: post\ntitle: "${title}"\nauthor: "${author}"\ndate: ${dateStr}\ncategories: [${category}]\n---\n\n${content}`;

            // 1. 클립보드에 기사 내용 복사
            navigator.clipboard.writeText(fileContent).then(() => {
                // 2. 깃허브 '새 파일 만들기' 창으로 이동 (파일 이름만 들고 갑니다)
                const githubUrl = `https://github.com/HANJUN8/G-HIGH-TIMES/new/master/_posts?filename=${fileName}`;
                
                alert('기사 내용이 복사되었습니다!\n\n이제 열리는 깃허브 화면의 빈 칸에 [붙여넣기(Ctrl+V)]를 하고 저장해주세요.');
                window.open(githubUrl, '_blank');
            }).catch(err => {
                alert('복사 실패! 직접 내용을 복사해서 깃허브에 붙여넣어주세요.');
            });
        }
    </script>
</body>
</html>
