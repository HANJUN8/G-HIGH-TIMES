<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>G-HIGH TIMES - 기사작성</title>
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f4f4; padding: 40px; display: flex; justify-content: center; }
        .editor-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        h2 { border-bottom: 2px solid #000; padding-bottom: 10px; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .publish-btn { background: #d32f2f; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; transition: 0.3s; margin-top: 15px; }
        .publish-btn:hover { background: #b71c1c; }
        p, .notice { color: #666; font-size: 14px; line-height: 1.5; }
        .notice { background: #fff3cd; padding: 10px; border-left: 4px solid #ffc107; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="editor-container">
        <h2>📰 G-HIGH TIMES 기사 작성</h2>
        
        <div class="notice">
            <strong>📸 사진 넣는 꿀팁:</strong> 여기서 글을 다 꾸미고 [발행하기]를 누르면 깃허브 화면으로 넘어갑니다. <b>그 깃허브 화면의 텍스트 칸에 사진 파일을 마우스로 '드래그 앤 드롭' 하면 사진이 마법처럼 들어갑니다!</b>
        </div>

        <select id="category">
            <option value="News">News (뉴스)</option>
            <option value="Blog">Blog (블로그/칼럼)</option>
            <option value="Interview">Interview (인터뷰)</option>
        </select>

        <input type="text" id="title" placeholder="기사 제목을 입력하세요">
        <input type="text" id="author" placeholder="작성자 이름">
        
        <textarea id="content"></textarea>
        
        <button class="publish-btn" onclick="publishArticle()">🚀 기사 발행 준비완료 (깃허브로 이동)</button>
    </div>

    <script>
        // 글 꾸미기 에디터 실행!
        const easyMDE = new EasyMDE({
            element: document.getElementById('content'),
            placeholder: "기사 내용을 작성하세요. 위 버튼을 눌러 글씨를 굵게 하거나 인용구를 넣을 수 있습니다!",
            spellChecker: false,
            status: false
        });

        function publishArticle() {
            const category = document.getElementById('category').value;
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            // 에디터에서 꾸며진 글 내용을 가져옵니다.
            const content = easyMDE.value();
            
            if(!title || !content) { alert('제목과 내용을 입력해주세요!'); return; }

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const fileName = `${dateStr}-${Math.floor(Math.random()*1000)}.md`;
            
            const fileContent = `---\nlayout: post\ntitle: "${title}"\nauthor: "${author}"\ndate: ${dateStr}\ncategories: [${category}]\n---\n\n${content}`;

            const githubUrl = `https://github.com/HANJUN8/G-HIGH-TIMES/new/master/_posts?filename=${fileName}&value=${encodeURIComponent(fileContent)}`;
            
            alert('작성된 기사를 가지고 깃허브로 이동합니다.\n사진을 넣고 싶다면 다음 화면에서 사진을 드래그해서 넣어주세요!');
            window.open(githubUrl, '_blank');
        }
    </script>
</body>
</html>
