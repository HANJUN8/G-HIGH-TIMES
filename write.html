<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>G-HIGH TIMES - 기사 작성</title>
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f4f4f4; padding: 20px; display: flex; justify-content: center; }
        .editor-container { background: white; padding: 40px; border: 1px solid #000; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 850px; }
        h2 { font-family: 'Playfair Display', serif; text-align: center; border-bottom: 3px double #000; padding-bottom: 15px; margin-bottom: 25px; }
        #token-area { background: #fff3cd; padding: 15px; border: 1px solid #ffeeba; margin-bottom: 20px; text-align: center; }
        .hidden { display: none !important; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        .publish-btn { background: #000; color: white; border: none; padding: 20px; font-size: 20px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.3s; }
        .publish-btn:hover { background: #333; }
    </style>
</head>
<body>
    <div class="editor-container">
        <h2>THE G-HIGH TIMES</h2>
        <div id="token-area">
            <strong>🔑 최초 1회 인증</strong>
            <input type="password" id="github-token" placeholder="GitHub 토큰 입력">
        </div>
        <select id="category">
            <option value="News">News</option>
            <option value="Editorial">Editorial</option>
            <option value="Interview">Interview</option>
        </select>
        <input type="text" id="title" placeholder="헤드라인 입력">
        <input type="text" id="author" placeholder="기자 이름">
        <textarea id="content"></textarea>
        <button id="btn-submit" class="publish-btn" onclick="directPublish()">📰 기사 발행하기</button>
    </div>

    <script>
        const easyMDE = new EasyMDE({ element: document.getElementById('content'), spellChecker: false });
        const savedToken = localStorage.getItem('gh-token');
        if (savedToken) {
            document.getElementById('github-token').value = savedToken;
            document.getElementById('token-area').classList.add('hidden');
        }

        async function directPublish() {
            const token = document.getElementById('github-token').value;
            const category = document.getElementById('category').value;
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const content = easyMDE.value();

            if(!token || !title || !content) { alert('빈 칸을 채워주세요!'); return; }
            const btn = document.getElementById('btn-submit');
            btn.disabled = true; btn.innerText = "발행 중...";

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const displayDate = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`;
            const fileName = `${dateStr}-${Math.floor(Math.random()*10000)}.md`;

            // 본문에서는 복잡한 스크립트를 제거하고 디자인만 남깁니다.
            const fileContent = `---
layout: post
title: "${title}"
author: "${author}"
date: ${dateStr}
categories: [${category}]
excerpt: "${content.substring(0, 100).replace(/\n/g, ' ')}..."
---

<div class="gh-article" style="font-family: 'Noto Serif KR', serif; max-width: 700px; margin: 0 auto; color: #1a1a1a; line-height: 1.9;">
  <h1 style="font-family: 'Playfair Display', serif; font-size: 3.2rem; text-align: center; margin-bottom: 20px; line-height: 1.1; color: #000; word-break: keep-all;">${title}</h1>
  <div style="text-align: center; border-top: 1px solid #000; border-bottom: 1px solid #000; padding: 15px 0; margin-bottom: 40px; font-size: 14px; letter-spacing: 1px;">
    <b>BY ${author}</b> <span style="margin: 0 10px; color: #ccc;">|</span> <b>${displayDate}</b>
  </div>
  <div style="font-size: 1.15rem; text-align: justify; white-space: pre-wrap;">${content}</div>
  <div style="margin-top: 50px; padding-top: 20px; text-align: center; font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.5rem;">G-HIGH TIMES GAZETTE</div>
</div>`;

            try {
                const response = await fetch(`https://api.github.com/repos/HANJUN8/G-HIGH-TIMES/contents/_posts/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Gazette: ${title}`, content: btoa(unescape(encodeURIComponent(fileContent))) })
                });
                if (response.ok) {
                    localStorage.setItem('gh-token', token);
                    alert('🎉 발행 성공!');
                    location.reload();
                } else { alert('에러!'); }
            } catch (e) { alert('연결 실패!'); }
            finally { btn.disabled = false; btn.innerText = "📰 기사 발행하기"; }
        }
    </script>
</body>
</html>
