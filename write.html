<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>G-HIGH TIMES - 기사 작성</title>
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f4f4f4; padding: 20px; display: flex; justify-content: center; }
        .editor-container { background: white; padding: 40px; border: 1px solid #000; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 850px; }
        h2 { font-family: 'Playfair Display', serif; text-align: center; border-bottom: 3px double #000; padding-bottom: 15px; margin-bottom: 25px; }
        
        /* 토큰 입력창: 토큰이 없을 때만 보이고, 있으면 아예 사라짐 */
        #token-area { background: #fff3cd; padding: 15px; border: 1px solid #ffeeba; margin-bottom: 20px; text-align: center; }
        .hidden { display: none !important; }
        
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        .publish-btn { background: #000; color: white; border: none; padding: 20px; font-size: 20px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.3s; }
        .publish-btn:hover { background: #333; }
        .footer-info { font-size: 11px; color: #999; text-align: center; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="editor-container">
        <h2>THE G-HIGH TIMES</h2>
        
        <div id="token-area">
            <strong>🔑 최초 1회 인증이 필요합니다</strong><br>
            <input type="password" id="github-token" placeholder="여기에 GitHub 토큰을 붙여넣으세요">
            <p style="font-size: 11px; color: #856404;">* 기사가 한 번 성공적으로 발행되면 이 창은 다시 나타나지 않습니다.</p>
        </div>

        <select id="category">
            <option value="News">종합 뉴스 (News)</option>
            <option value="Editorial">사설 및 칼럼 (Editorial)</option>
            <option value="Interview">특별 인터뷰 (Interview)</option>
        </select>
        <input type="text" id="title" placeholder="헤드라인(제목)을 입력하세요">
        <input type="text" id="author" placeholder="작성 기자 이름">
        <textarea id="content"></textarea>
        
        <button id="btn-submit" class="publish-btn" onclick="directPublish()">📰 기사 즉시 발행하기</button>
        <div class="footer-info" onclick="resetToken()">[설정 초기화]</div>
    </div>

    <script>
        const easyMDE = new EasyMDE({ element: document.getElementById('content'), spellChecker: false });
        
        // 브라우저 기억 장치(localStorage)에서 토큰을 찾아옵니다.
        const savedToken = localStorage.getItem('gh-token');
        if (savedToken) {
            document.getElementById('github-token').value = savedToken;
            document.getElementById('token-area').classList.add('hidden'); // 저장된 토큰이 있으면 숨김!
        }

        function resetToken() {
            if(confirm('인증 정보를 삭제하고 다시 설정하시겠습니까?')) {
                localStorage.removeItem('gh-token');
                location.reload();
            }
        }

        async function directPublish() {
            const token = document.getElementById('github-token').value;
            const category = document.getElementById('category').value;
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const content = easyMDE.value();

            if(!token || !title || !content) { alert('빈 칸을 모두 채워주세요!'); return; }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true; btn.innerText = "신문 인쇄 중...";

            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const displayDate = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`;
            const fileName = `${dateStr}-${Math.floor(Math.random()*10000)}.md`;

            // 🏛️ 웹사이트에서 보여질 고품격 신문 레이아웃 (한국어 최적화)
            const premiumLayout = `
<div class="gh-premium-article" style="font-family: 'Noto Serif KR', serif; max-width: 700px; margin: 0 auto; color: #1a1a1a; line-height: 1.8;">
  <h1 style="font-family: 'Playfair Display', serif; font-size: 3.5rem; text-align: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 20px;">${title}</h1>
  <div style="text-align: center; font-size: 0.9rem; border-top: 2px solid #000; border-bottom: 2px solid #000; padding: 10px 0; margin-bottom: 40px; text-transform: uppercase;">
    <b>BY ${author}</b> <span style="margin: 0 10px; color: #ddd;">|</span> <b>${displayDate}</b>
  </div>
  <div style="font-size: 1.2rem; text-align: justify; white-space: pre-wrap;">${content}</div>
  <div style="margin-top: 100px; border-top: 1px double #000; padding-top: 20px; text-align: center; font-style: italic; color: #888;">G-HIGH TIMES GAZETTE</div>
</div>`;

            const fileContent = `---\nlayout: post\ntitle: "${title}"\nauthor: "${author}"\ndate: ${dateStr}\ncategories: [${category}]\n---\n\n${premiumLayout}`;

            try {
                const response = await fetch(`https://api.github.com/repos/HANJUN8/G-HIGH-TIMES/contents/_posts/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Press: ${title}`, content: btoa(unescape(encodeURIComponent(fileContent))) })
                });

                if (response.ok) {
                    localStorage.setItem('gh-token', token); // 발행 성공 시에만 브라우저에 토큰을 영구 저장!
                    alert('🎉 발행 성공! 이제부터 이 브라우저에서는 인증 없이 바로 사용 가능합니다.');
                    location.reload();
                } else {
                    alert('❌ 토큰이 잘못되었습니다. 다시 입력해주세요.');
                    resetToken();
                }
            } catch (e) { alert('연결 에러!'); }
            finally { btn.disabled = false; btn.innerText = "📰 기사 즉시 발행하기"; }
        }
    </script>
</body>
</html>
